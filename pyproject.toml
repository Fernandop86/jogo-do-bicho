[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jogo-do-bicho-analytics"
version = "0.1.0"
description = "Ferramenta de analise estatistica de dados historicos de loterias (uso educacional)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Fernando Pereira de Oliveira", email = "fernandopereiradeoliveira23@gmail.com" }
]
keywords = ["analytics", "statistics", "lottery", "data-science", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
    "streamlit-autorefresh>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/Fernandop86/jogo-do-bicho"
Repository = "https://github.com/Fernandop86/jogo-do-bicho"
Issues = "https://github.com/Fernandop86/jogo-do-bicho/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["motor"]
